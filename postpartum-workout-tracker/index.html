<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Restore — Postpartum Recovery</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%237A9B85'/><path d='M20 34c4 6 20 6 24 0' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/><circle cx='32' cy='24' r='5' fill='white'/></svg>">
<style>
  :root{
    --bg:#FBF7F2;
    --surface:#FFFFFF;
    --divider:#F1E9DF;
    --primary:#7A9B85;
    --primary-deep:#4F6E5C;
    --primary-soft:#E6EFE8;
    --accent:#E5A6A0;
    --celebrate:#D98C6B;
    --text:#2E2A26;
    --muted:#6B6259;
    --caution-bg:#FCEFE3;
    --caution-fg:#9C5A2A;
    --shadow:0 1px 2px rgba(46,42,38,.06),0 8px 24px rgba(46,42,38,.05);
    --radius:16px;
    --radius-sm:10px;
    --tap:48px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
  h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25;color:var(--text)}
  h1{font-size:1.6rem}
  h2{font-size:1.25rem}
  h3{font-size:1.05rem}
  p{margin:0}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  .app{max-width:480px;margin:0 auto;padding:20px 18px 120px;position:relative}
  .timer-num,.tabular{font-variant-numeric:tabular-nums}

  /* Top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-logo{width:36px;height:36px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700}
  .brand-name{font-weight:600;letter-spacing:.2px}
  .brand-sub{font-size:.78rem;color:var(--muted)}
  .icon-btn{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:hover{background:var(--divider)}

  /* Cards */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
  .card.tight{padding:14px 16px}
  .card.flat{box-shadow:none;border:1px solid var(--divider)}
  .card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-title h2,.card-title h3{margin:0}
  .meta{color:var(--muted);font-size:.85rem}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:999px;background:var(--primary);color:#fff;font-weight:600;min-height:var(--tap);transition:transform .12s ease,background .15s}
  .btn:active{transform:scale(.98)}
  .btn:hover{background:var(--primary-deep)}
  .btn.secondary{background:var(--primary-soft);color:var(--primary-deep)}
  .btn.secondary:hover{background:#d9e6dd}
  .btn.ghost{background:transparent;color:var(--primary-deep)}
  .btn.ghost:hover{background:var(--divider)}
  .btn.warm{background:var(--celebrate)}
  .btn.warm:hover{background:#c0794e}
  .btn.block{display:flex;width:100%}
  .btn.lg{padding:16px 22px;font-size:1.05rem}

  /* Banner */
  .banner{background:var(--caution-bg);color:var(--caution-fg);border-radius:var(--radius-sm);padding:12px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start}
  .banner .icon{flex:0 0 auto;margin-top:2px}

  /* Progress */
  .progress-track{display:flex;gap:4px;flex-wrap:wrap}
  .seg{flex:1 1 12px;height:8px;border-radius:4px;background:var(--divider);transition:background .3s}
  .seg.done{background:var(--primary)}
  .seg.today{background:var(--accent)}

  /* List */
  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--divider);min-height:var(--tap);text-align:left}
  .row:hover{background:#FAF6F1}
  .row.done{background:var(--primary-soft);border-color:#cfe0d5}
  .row .row-thumb{width:48px;height:48px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary-deep);flex:0 0 auto}
  .row .row-body{flex:1 1 auto;min-width:0}
  .row .row-title{font-weight:600;display:flex;align-items:center;gap:8px}
  .row .row-meta{font-size:.82rem;color:var(--muted)}
  .row .row-tail{flex:0 0 auto;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary-deep);font-size:.74rem;font-weight:600}
  .badge.warm{background:#FBE7DC;color:var(--celebrate)}
  .badge.muted{background:var(--divider);color:var(--muted)}

  /* Disclaimer / Modal */
  .modal-back{position:fixed;inset:0;background:rgba(46,42,38,.45);display:grid;place-items:center;z-index:100;padding:20px;backdrop-filter:blur(2px)}
  .modal{background:var(--surface);border-radius:var(--radius);max-width:440px;width:100%;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.2);max-height:90vh;overflow:auto}
  .modal h2{margin-bottom:8px}
  .modal p{color:var(--muted);font-size:.92rem;margin-bottom:12px}
  .check{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:var(--radius-sm);background:var(--bg);margin-bottom:8px;cursor:pointer}
  .check input{margin-top:3px;flex:0 0 auto;transform:scale(1.1)}
  .check span{font-size:.9rem}

  /* Active workout mode */
  .active{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
  .active-top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
  .dots{display:flex;gap:6px;flex:1 1 auto;justify-content:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--divider)}
  .dot.done{background:var(--primary)}
  .dot.cur{background:var(--accent);transform:scale(1.4)}
  .stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
  .stage .ex-name{font-size:1.5rem;font-weight:600;margin:12px 0 6px}
  .stage .ex-desc{color:var(--muted);max-width:340px;margin:0 auto 16px;font-size:.95rem}
  .stage svg.ex-illustration{width:160px;height:160px}
  .stage .tracker{margin-top:14px;width:100%;max-width:340px}
  .stage .meta-line{color:var(--muted);font-size:.85rem;margin-top:4px}

  /* Ring timer */
  .ring-wrap{position:relative;width:220px;height:220px;margin:0 auto}
  .ring-bg,.ring-fg{fill:none;stroke-width:12;stroke-linecap:round}
  .ring-bg{stroke:var(--divider)}
  .ring-fg{stroke:var(--primary);transition:stroke-dashoffset .25s linear}
  .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-time{font-size:2.6rem;font-weight:600;letter-spacing:.5px}
  .ring-sub{color:var(--muted);font-size:.85rem}

  /* Reps tracker */
  .reps-card{background:var(--surface);border-radius:var(--radius);padding:18px;border:1px solid var(--divider)}
  .reps-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .reps-num{font-size:2.2rem;font-weight:600}
  .reps-target{color:var(--muted);font-size:.95rem}
  .set-pips{display:flex;gap:8px;justify-content:center;margin:8px 0 16px}
  .pip{width:14px;height:14px;border-radius:50%;background:var(--divider);transition:background .3s,transform .3s}
  .pip.done{background:var(--primary);animation:bloom .5s ease}
  .pip.cur{background:var(--accent);transform:scale(1.25)}
  @keyframes bloom{0%{transform:scale(.6)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

  /* Hold pulse */
  .hold-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .hold-circle{width:200px;height:200px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;transform:scale(.6);transition:transform 1s ease,background 1s ease}
  .hold-circle.expand{transform:scale(1);background:#cfe0d5}
  .hold-text{font-weight:600;font-size:1.4rem;color:var(--primary-deep)}

  /* Action bar */
  .action-bar{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 0;background:linear-gradient(to top,var(--bg) 70%,rgba(251,247,242,0))}
  .action-bar .btn{flex:1 1 auto}

  /* Transition */
  .transition-screen{position:fixed;inset:0;background:var(--bg);z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
  .transition-screen .next-up{color:var(--muted);margin-bottom:8px}
  .transition-screen .next-name{font-size:1.3rem;font-weight:600;margin-bottom:24px}

  /* Complete screen */
  .complete-screen{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;animation:fadeIn .3s ease}
  .complete-card{background:var(--surface);border-radius:var(--radius);padding:30px 24px;box-shadow:var(--shadow);max-width:380px;width:100%;animation:slideUp .5s ease}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .complete-icon{width:80px;height:80px;margin:0 auto 14px}

  /* Confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

  /* Checkmark draw */
  .check-svg{width:64px;height:64px}
  .check-svg path{stroke-dasharray:60;stroke-dashoffset:60;animation:drawCheck .7s .1s ease forwards}
  @keyframes drawCheck{to{stroke-dashoffset:0}}

  /* Medal */
  .medal{width:80px;height:80px}

  /* Tiny svg in row */
  .row-thumb svg{width:32px;height:32px}

  /* Settings */
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--divider)}
  .settings-row:last-child{border-bottom:0}
  .toggle{position:relative;width:44px;height:26px;background:var(--divider);border-radius:13px;cursor:pointer;transition:background .2s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on{background:var(--primary)}
  .toggle.on::after{transform:translateX(18px)}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 18px;border-radius:999px;font-size:.9rem;z-index:90;animation:toastIn .3s ease}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  /* Helpers */
  .stack-8{display:flex;flex-direction:column;gap:8px}
  .stack-12{display:flex;flex-direction:column;gap:12px}
  .row-end{display:flex;justify-content:flex-end}
  .center{text-align:center}

  /* Disclaimer link inline */
  .link{color:var(--primary-deep);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font:inherit}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .pip.done{animation:none}
  }
</style>
</head>
<body>

<!-- SVG symbol library: simple two-color line-art stick figures, 100x100 viewBox -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">

    <style>

      .fill{fill:#7A9B85}

    </style>
    <!-- Diaphragmatic breathing: reclined figure, hand on belly, breath arrows -->

    <!-- Shoulder rolls -->

    <!-- Toe taps / marching -->

    </symbol>

      <circle cx="20" cy="38" r="6" class="fill"/>

/* ============================================================
   STORE — localStorage with versioning
   ============================================================ */
const KEY = "pp_tracker_v1";
const Store = {
  state: null,
  defaults(){
    return {
      version:1,
      programStartDate: PROGRAM.startDate,
      completedSessions:{},
      exerciseLog:{},
      weeklyChecks:{},
      preferences:{ soundOn:true, reduceMotion:false, vibrate:true, disclaimerAcknowledgedAt:null },
      lastViewedSession:null,
      celebrationsShown:[]
    };
  },
  load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw){ this.state = this.defaults(); return this.state; }
      const parsed = JSON.parse(raw);
      this.state = Object.assign(this.defaults(), parsed);
      this.state.preferences = Object.assign(this.defaults().preferences, parsed.preferences || {});
      return this.state;
    }catch(e){
      console.warn("Store load failed", e);
      this.state = this.defaults();
      return this.state;
    }
  },
  save(patch){
    if(patch) Object.assign(this.state, patch);
    try{ localStorage.setItem(KEY, JSON.stringify(this.state)); }
    catch(e){ toast("Couldn't save progress (storage full)"); }
  },
  reset(){
    this.state = this.defaults();
    try{ localStorage.removeItem(KEY); }catch(e){}
  }
};

/* ============================================================
   DATE HELPERS
   ============================================================ */
function todayISO(){ const d = new Date(); return d.toISOString().slice(0,10); }
function daysBetween(aISO, bISO){
  const a = new Date(aISO+"T00:00:00"); const b = new Date(bISO+"T00:00:00");
  return Math.floor((b - a) / 86400000);
}
function currentWeekIndex(){
  const d = daysBetween(Store.state.programStartDate, todayISO());
  if(d < 0) return 0;
  return Math.min(Math.floor(d / 7), PROGRAM.weeks.length - 1);
}
function nextRecommendedSession(){
  const completed = Store.state.completedSessions;
  const wi = currentWeekIndex();
  for(const s of PROGRAM.weeks[wi].sessions){ if(!completed[s.id]) return {...s, weekId:PROGRAM.weeks[wi].id}; }
  for(let i=wi+1;i<PROGRAM.weeks.length;i++){
    for(const s of PROGRAM.weeks[i].sessions){ if(!completed[s.id]) return {...s, weekId:PROGRAM.weeks[i].id}; }
  }
  for(const s of ALL_SESSIONS){ if(!completed[s.id]) return s; }
  return null;
}

/* ============================================================
   UI HELPERS
   ============================================================ */
const root = document.getElementById("app");
const overlayRoot = document.getElementById("overlay-root");
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k==="style") e.setAttribute("style", attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for(const c of children){
    if(c == null) continue;
    if(Array.isArray(c)) c.forEach(x => x && e.appendChild(typeof x === "string" ? document.createTextNode(x) : x));
    else if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
function svgUse(id, size=48){
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><use href="#${id}"/></svg>`;
}
function fmtMMSS(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${sec<10?"0":""}${sec}`;
}
function toast(msg, ms=2200){
  const t = el("div", {class:"toast", role:"status"}, msg);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

/* ============================================================
   AUDIO + HAPTICS
   ============================================================ */
let audioCtx = null;
function ensureAudio(){
  if(!Store.state.preferences.soundOn) return null;
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  return audioCtx;
}
function chime(notes=[523.25, 659.25, 783.99], dur=0.18){
  const ctx = ensureAudio(); if(!ctx) return;
  notes.forEach((freq,i)=>{
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + i*dur*0.7;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.02);
  });
}
function ping(freq=660){ chime([freq], 0.14); }
function buzz(ms=80){
  if(!Store.state.preferences.vibrate) return;
  if(navigator.vibrate) navigator.vibrate(ms);
}

/* ============================================================
   CONFETTI
   ============================================================ */
const confettiCanvas = document.getElementById("confetti");
const confettiCtx = confettiCanvas.getContext("2d");
function resizeConfetti(){
  confettiCanvas.width = window.innerWidth * devicePixelRatio;
  confettiCanvas.height = window.innerHeight * devicePixelRatio;
  confettiCanvas.style.width = window.innerWidth+"px";
  confettiCanvas.style.height = window.innerHeight+"px";
  confettiCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize", resizeConfetti); resizeConfetti();
const CONFETTI_COLORS = ["#7A9B85","#E5A6A0","#D98C6B","#4F6E5C","#F1E9DF","#C58A5A"];
function reduceMotion(){
  return Store.state.preferences.reduceMotion ||
         (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function confettiBurst(intensity=1){
  if(reduceMotion()) return;
  const count = Math.floor(80 * intensity);
  const W = window.innerWidth, H = window.innerHeight;
  const particles = [];
  for(let i=0;i<count;i++){
    particles.push({
      x: W/2 + (Math.random()-0.5)*W*0.4,
      y: H*0.3 + (Math.random()-0.5)*40,
      vx: (Math.random()-0.5)*8,
      vy: -Math.random()*12 - 4,
      g: 0.35,
      size: 6 + Math.random()*6,
      color: CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
      rot: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.3,
      life: 0,
      max: 100 + Math.random()*60
    });
  }
  let frame = 0;
  function step(){
    confettiCtx.clearRect(0,0,W,H);
    let alive = 0;
    for(const p of particles){
      p.life++; if(p.life>p.max) continue;
      alive++;
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      const opacity = 1 - p.life/p.max;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.globalAlpha = opacity;
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
      confettiCtx.restore();
    }
    frame++;
    if(alive>0 && frame<300) requestAnimationFrame(step);
    else confettiCtx.clearRect(0,0,W,H);
  }
  requestAnimationFrame(step);
}

  const c3 = el("label",{class:"check"});
  c3.innerHTML = `<input type="checkbox"><span>I'll stop and contact my provider if I notice pain, leakage, midline doming, or unusual bleeding.</span>`;
  c1.querySelector("input").addEventListener("change", e => { cleared = e.target.checked; update(); });
  c2.querySelector("input").addEventListener("change", e => { painFree = e.target.checked; update(); });
  c3.querySelector("input").addEventListener("change", e => { providerOk = e.target.checked; update(); });
  const btn = el("button",{class:"btn block lg", style:"margin-top:14px", onclick:()=>{
    Store.state.preferences.disclaimerAcknowledgedAt = new Date().toISOString();
    Store.save();
    back.remove();

  btn.disabled = true; btn.style.opacity = 0.5;

  overlayRoot.appendChild(back);
}

  );

  const banner = el("div",{class:"banner", role:"note"});
  banner.innerHTML = `<div class="icon">${iconHeartHTML()}</div><div>Move slowly. Stop at pain, leaking, midline bulging, or returning bleeding. This complements — not replaces — your provider's guidance.</div>`;

  const segs = [];
  for(let i=0;i<TOTAL_SESSIONS;i++){
    const s = ALL_SESSIONS[i];
    const cls = completed[s.id] ? "seg done" : (next && next.id === s.id ? "seg today" : "seg");
    segs.push(el("div",{class:cls, title:s.title}));
  }

  const progressCard = el("div",{class:"card"},
    el("div",{class:"card-title"},
      el("h2",{}, "Your progress"),
      el("span",{class:"meta"}, `${completedCount} / ${TOTAL_SESSIONS}`)
    ),
    el("div",{class:"progress-track"}, segs),
    el("div",{class:"meta", style:"margin-top:10px"}, `Week ${weekObj.id} of ${PROGRAM.weeks.length} · post-op week ${weekObj.postOpWeek}`)
  );

  let nextCard = null;
  if(next){
    nextCard = el("div",{class:"card"},
      el("div",{class:"meta"}, "Up next"),
      el("h2",{style:"margin:4px 0 6px"}, next.title),
      el("div",{class:"meta", style:"margin-bottom:14px"}, `${next.est} min · ${PROGRAM.weeks[next.weekId-1].title}`),
      el("button",{class:"btn block lg", onclick:()=>Router.go(`#/session/${next.id}`)}, "Open session")
    );
  } else {
    nextCard = el("div",{class:"card center"},
      el("div",{class:"complete-icon", html:medalSVG()}),
      el("h2",{}, "Program complete"),
      el("p",{class:"meta", style:"margin:8px 0 14px"}, "You finished all 17 sessions. Beautiful work."),
      el("button",{class:"btn warm block", onclick:()=>{
        if(confirm("Start a new round? Progress will reset.")){ Store.reset(); Store.load().preferences.disclaimerAcknowledgedAt = new Date().toISOString(); Store.save(); render(); }
      }}, "Start a new round")
    );
  }

  // Weekly check-in
  const weekKey = "w"+weekObj.id;
  const checkDone = Store.state.weeklyChecks[weekKey] && Store.state.weeklyChecks[weekKey].diastasisChecked;
  const checkCard = el("div",{class:"card tight"},
    el("div",{class:"row-thumb", style:"display:inline-grid;vertical-align:middle;margin-right:10px",  html: iconCheckHTML()}),
    el("strong",{}, "Weekly diastasis self-check "),
    el("p",{class:"meta", style:"margin:6px 0 10px"}, "Lie back, knees bent. Lift head and check the gap above and below the navel. Two fingers or less = continue. More than two, or doming, = pause and message your PT."),
    checkDone
      ? el("span",{class:"badge"}, "Done this week ✓")
      : el("button",{class:"btn secondary", onclick:()=>{
          Store.state.weeklyChecks[weekKey] = { diastasisChecked:true, checkedAt:new Date().toISOString() };
          Store.save(); render(); toast("Checked in for this week");
        }}, "I've done it")
  );

  // Week sessions
  const weekList = el("div",{class:"card"},
    el("div",{class:"card-title"},
      el("h2",{}, `Week ${weekObj.id}: ${weekObj.title}`),
      el("span",{class:"badge muted"}, `post-op wk ${weekObj.postOpWeek}`)
    ),
    el("p",{class:"meta", style:"margin-bottom:12px"}, weekObj.summary),
    el("div",{class:"list"},
      ...weekObj.sessions.map(s => sessionRow(s, weekObj.id))
    )
  );

  // Browse all
  const all = el("div",{class:"card"},
    el("div",{class:"card-title"},
      el("h2",{}, "Full program"),
      el("span",{class:"badge muted"}, "4 weeks")
    ),
    ...PROGRAM.weeks.map(w => el("details",{style:"margin-bottom:10px"},
      el("summary",{style:"cursor:pointer;padding:8px 0;font-weight:600"}, `Week ${w.id} — ${w.title}`),
      el("div",{class:"list", style:"margin-top:8px"}, ...w.sessions.map(s => sessionRow(s, w.id)))
    ))
  );

  return [topbar, banner, progressCard, nextCard, checkCard, weekList, all];
}

function sessionRow(s, weekId){
  const completed = !!Store.state.completedSessions[s.id];
  const firstEx = EX[s.exerciseIds[0]];
  return el("button",{class:"row "+(completed?"done":""), onclick:()=>Router.go(`#/session/${s.id}`)},
    el("div",{class:"row-thumb", html:svgUse(firstEx?firstEx.svg:"ex-generic", 40)}),
    el("div",{class:"row-body"},
      el("div",{class:"row-title"}, s.title, completed ? el("span",{class:"badge"}, "Complete") : null),
      el("div",{class:"row-meta"}, `${s.est} min · ${s.exerciseIds.length} exercise${s.exerciseIds.length>1?"s":""}`)
    ),
    el("div",{class:"row-tail"}, "›")
  );
}

function viewSession(id){
  const session = ALL_SESSIONS.find(s => s.id === id);
  if(!session){ Router.go("#/home"); return []; }
  const week = PROGRAM.weeks.find(w => w.id === session.weekId);
  const completed = !!Store.state.completedSessions[session.id];

  const top = el("div",{class:"topbar"},
    el("button",{class:"icon-btn", "aria-label":"Back", onclick:()=>Router.go("#/home")}, iconBack()),
    el("div",{class:"brand-name"}, `Week ${week.id}`),
    el("div",{style:"width:48px"})
  );

  const head = el("div",{class:"card"},
    el("div",{class:"meta"}, `${week.title} · ${session.est} min`),
    el("h1",{style:"margin:6px 0 8px"}, session.title),
    completed ? el("div",{class:"badge"}, "Completed ✓") : null,
    el("p",{class:"meta", style:"margin-top:10px"}, week.summary)
  );

  const list = el("div",{class:"card"},
    el("h3",{style:"margin-bottom:10px"}, "Exercises"),
    el("div",{class:"list"},
      ...session.exerciseIds.map(eid => {
        const e = EX[eid];
        return el("div",{class:"row"},
          el("div",{class:"row-thumb", html:svgUse(e.svg, 40)}),
          el("div",{class:"row-body"},
            el("div",{class:"row-title"}, e.name),
            el("div",{class:"row-meta"}, trackerSummary(e.tracker))
          )
        );
      })
    )
  );

  const reminder = el("div",{class:"banner", style:"margin-bottom:14px"});
  reminder.innerHTML = `<div class="icon">${iconHeartHTML()}</div><div>Begin every core exercise with an exhale and a gentle pelvic-floor lift. Skip anything that hurts.</div>`;

  const startBar = el("div",{class:"action-bar"},
    el("button",{class:"btn block lg", onclick:()=>Router.go(`#/active/${session.id}`)},
      completed ? "Start again" : "Start session")
  );

  return [top, head, reminder, list, startBar];
}

function trackerSummary(t){
  if(t.type==="time") return `${Math.round(t.seconds/60*10)/10} min`;
  if(t.type==="walk") return `${t.minutes} min walk`;
  if(t.type==="reps") return `${t.sets} × ${t.reps}${t.perSide?" each side":""}`;
  if(t.type==="hold") return t.reps>1 ? `${t.sets} × ${t.reps} × ${t.holdSec}s${t.perSide?" each side":""}` : `${t.sets} × ${t.holdSec}s${t.perSide?" each side":""}`;
  return "";
}

/* ============================================================
   ACTIVE WORKOUT
   ============================================================ */
const Active = {
  session:null, idx:0, raf:null,
  sessionStartedAt:0,

  start(sessionId){
    this.session = ALL_SESSIONS.find(s => s.id === sessionId);
    if(!this.session){ Router.go("#/home"); return; }
    this.idx = 0;
    this.sessionStartedAt = Date.now();
    Store.state.lastViewedSession = sessionId; Store.save();
    this.renderExercise();
  },

  renderExercise(){
    if(this.idx >= this.session.exerciseIds.length){ this.complete(); return; }
    const ex = EX[this.session.exerciseIds[this.idx]];
    overlayRoot.innerHTML = "";
    const wrap = el("div",{class:"active", role:"region","aria-label":"Active workout"});

    const dots = el("div",{class:"dots"},
      ...this.session.exerciseIds.map((_,i)=>{
        let cls = "dot";
        if(i < this.idx) cls += " done";
        else if(i === this.idx) cls += " cur";
        return el("div",{class:cls});
      })
    );
    const top = el("div",{class:"active-top"},
      el("button",{class:"icon-btn","aria-label":"Quit", onclick:()=>{
        if(confirm("Quit this session? Progress on the current exercise will be lost.")){
          this.cleanup(); Router.go(`#/session/${this.session.id}`);
        }
      }}, iconClose()),
      dots,
      el("div",{style:"width:48px"})
    );

    const stage = el("div",{class:"stage"});
    stage.innerHTML = `
      <svg class="ex-illustration" viewBox="0 0 100 100" aria-hidden="true"><use href="#${ex.svg}"/></svg>
      <div class="ex-name">${escapeHtml(ex.name)}</div>
      <div class="ex-desc">${escapeHtml(ex.desc)}</div>
    `;

    const trackerHost = el("div",{class:"tracker"});
    stage.appendChild(trackerHost);

    const actions = el("div",{class:"action-bar"});
    wrap.appendChild(top); wrap.appendChild(stage); wrap.appendChild(actions);
    overlayRoot.appendChild(wrap);

    this.mountTracker(ex, trackerHost, actions);
  },

  mountTracker(ex, host, actions){
    const t = ex.tracker;
    if(t.type==="time") this.mountTime(ex, host, actions);
    else if(t.type==="walk") this.mountWalk(ex, host, actions);
    else if(t.type==="reps") this.mountReps(ex, host, actions);
    else if(t.type==="hold") this.mountHold(ex, host, actions);
  },

  mountTime(ex, host, actions){
    const total = ex.tracker.seconds;
    let remaining = total, paused = false, last = performance.now();
    host.innerHTML = `
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" width="220" height="220">
          <circle class="ring-bg" cx="110" cy="110" r="96"/>
          <circle class="ring-fg" cx="110" cy="110" r="96" stroke-dasharray="603" stroke-dashoffset="0" transform="rotate(-90 110 110)"/>
        </svg>
        <div class="ring-label">
          <div class="ring-time tabular" id="ring-time">${fmtMMSS(remaining)}</div>
          <div class="ring-sub">remaining</div>
        </div>
      </div>
    `;
    const ring = host.querySelector(".ring-fg");
    const label = host.querySelector("#ring-time");
    const C = 2*Math.PI*96;
    ring.setAttribute("stroke-dasharray", C);
    function update(){
      const pct = remaining/total;
      ring.setAttribute("stroke-dashoffset", C*(1-pct));
      label.textContent = fmtMMSS(remaining);
    }
    update();
    const tick = (now)=>{
      const dt = (now - last)/1000; last = now;
      if(!paused){ remaining -= dt; if(remaining <= 0){ remaining = 0; update(); this.finishExercise(ex); return; } }
      update();
      Active.raf = requestAnimationFrame(tick);
    };
    Active.raf = requestAnimationFrame(tick);

    const pauseBtn = el("button",{class:"btn secondary", onclick:()=>{ paused = !paused; pauseBtn.textContent = paused ? "Resume" : "Pause"; }}, "Pause");
    const skipBtn = el("button",{class:"btn ghost", onclick:()=> this.finishExercise(ex)}, "Done");
    actions.innerHTML = ""; actions.appendChild(pauseBtn); actions.appendChild(skipBtn);
  },

  mountWalk(ex, host, actions){
    const totalSec = ex.tracker.minutes*60;
    let elapsed = 0, paused = true, last = performance.now();
    host.innerHTML = `
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" width="220" height="220">
          <circle class="ring-bg" cx="110" cy="110" r="96"/>
          <circle class="ring-fg" cx="110" cy="110" r="96" stroke-dasharray="603" stroke-dashoffset="603" transform="rotate(-90 110 110)"/>
        </svg>
        <div class="ring-label">
          <div class="ring-time tabular" id="ring-time">${fmtMMSS(elapsed)}</div>
          <div class="ring-sub" id="ring-sub">paused</div>
        </div>
      </div>
      <div class="meta-line">Goal: ${ex.tracker.minutes} minutes</div>
    `;
    const ring = host.querySelector(".ring-fg");
    const label = host.querySelector("#ring-time");
    const sub = host.querySelector("#ring-sub");
    const C = 2*Math.PI*96; ring.setAttribute("stroke-dasharray", C);
    function update(){
      const pct = Math.min(elapsed/totalSec,1);
      ring.setAttribute("stroke-dashoffset", C*(1-pct));
      label.textContent = fmtMMSS(elapsed);
    }
    const tick = (now)=>{
      const dt = (now - last)/1000; last = now;
      if(!paused){ elapsed += dt; if(elapsed >= totalSec){ elapsed = totalSec; update(); this.finishExercise(ex); return; } update(); }
      Active.raf = requestAnimationFrame(tick);
    };
    Active.raf = requestAnimationFrame(tick);

    const startBtn = el("button",{class:"btn", onclick:()=>{
      paused = !paused; last = performance.now();
      startBtn.textContent = paused ? "Resume" : "Pause";
      sub.textContent = paused ? "paused" : "walking";
    }}, "Start");
    const doneBtn = el("button",{class:"btn ghost", onclick:()=> this.finishExercise(ex)}, "Done");
    actions.innerHTML = ""; actions.appendChild(startBtn); actions.appendChild(doneBtn);
  },

  mountReps(ex, host, actions){
    const t = ex.tracker;
    const sides = t.perSide ? ["Left","Right"] : ["—"];
    let setIdx = 0, sideIdx = 0;
    const totalSets = t.sets * sides.length;
    function curSetNumber(){ return setIdx*sides.length + sideIdx + 1; }

    function render(){
      host.innerHTML = `
        <div class="reps-card">
          <div class="reps-row">
            <div>
              <div class="meta">Set ${curSetNumber()} of ${totalSets}${t.perSide ? " · "+sides[sideIdx]+" side" : ""}</div>
              <div class="reps-num tabular">${t.reps}<span class="reps-target"> reps</span></div>
            </div>
            <div class="meta-line">${ex.tracker.perSide?"each side":""}</div>
          </div>
          <div class="set-pips" id="pips"></div>
        </div>
      `;
      const pips = host.querySelector("#pips");
      for(let i=0;i<totalSets;i++){
        const cur = i === curSetNumber()-1;
        const done = i < curSetNumber()-1;
        pips.appendChild(el("div",{class:"pip "+(done?"done":cur?"cur":"")}));
      }
    }
    render();

    const setDone = el("button",{class:"btn lg", onclick:()=>{
      buzz(40); ping(700);
      sideIdx++;
      if(sideIdx >= sides.length){ sideIdx = 0; setIdx++; }
      if(setIdx >= t.sets){
        // last set — auto-finish without transition between sets
        this.finishExercise(ex);
        return;
      }
      render();
      this.showInterSetRest(ex.transition || 30, ()=> render());
    }}, "Set complete");
    const skip = el("button",{class:"btn ghost", onclick:()=> this.finishExercise(ex)}, "Skip");
    actions.innerHTML = ""; actions.appendChild(setDone); actions.appendChild(skip);
  },

  mountHold(ex, host, actions){
    const t = ex.tracker;
    const sides = t.perSide ? ["Left","Right"] : ["—"];
    let setIdx = 0, sideIdx = 0, repIdx = 0, phase="ready";
    let phaseRemaining = 0, paused = false, last = performance.now();
    function totalSets(){ return t.sets * sides.length; }
    function curSetNumber(){ return setIdx*sides.length + sideIdx + 1; }

    function shell(){
      host.innerHTML = `
        <div class="hold-wrap">
          <div class="hold-circle" id="hc"><div class="hold-text" id="ht">Get ready</div></div>
          <div class="meta-line">Set ${curSetNumber()} of ${totalSets()}${t.perSide?" · "+sides[sideIdx]+" side":""} · rep <span id="rc">${repIdx+1}</span> of ${t.reps}</div>
        </div>
      `;
    }
    shell();
    const circle = ()=> host.querySelector("#hc");
    const txt = ()=> host.querySelector("#ht");
    const repCount = ()=> host.querySelector("#rc");

    const startPhase = (which)=>{
      phase = which;
      if(which==="hold"){ circle().classList.add("expand"); txt().textContent = `Hold ${t.holdSec}s`; phaseRemaining = t.holdSec; }
      else if(which==="release"){ circle().classList.remove("expand"); txt().textContent = `Release ${t.releaseSec}s`; phaseRemaining = t.releaseSec; }
      else if(which==="ready"){ circle().classList.remove("expand"); txt().textContent = "Begin"; phaseRemaining = 2; }
    };
    startPhase("ready");

    const tick = (now)=>{
      const dt = (now-last)/1000; last = now;
      if(!paused){
        phaseRemaining -= dt;
        if(phaseRemaining<=0){
          if(phase==="ready"){ startPhase("hold"); }
          else if(phase==="hold"){
            ping(660); buzz(50);
            if(t.releaseSec>0){ startPhase("release"); }
            else { advanceRep(); }
          }
          else if(phase==="release"){ advanceRep(); }
        } else {
          if(phase==="hold") txt().textContent = `Hold ${Math.ceil(phaseRemaining)}s`;
          else if(phase==="release") txt().textContent = `Release ${Math.ceil(phaseRemaining)}s`;
          else if(phase==="ready") txt().textContent = `${Math.ceil(phaseRemaining)}…`;
        }
      }
      Active.raf = requestAnimationFrame(tick);
    };

    const advanceRep = ()=>{
      repIdx++;
      if(repIdx >= t.reps){
        repIdx = 0;
        sideIdx++;
        if(sideIdx >= sides.length){ sideIdx = 0; setIdx++; }
        if(setIdx >= t.sets){ this.finishExercise(ex); return; }
        // inter-set rest
        cancelAnimationFrame(Active.raf);
        this.showInterSetRest(ex.transition || 30, ()=>{ shell(); startPhase("ready"); last = performance.now(); Active.raf = requestAnimationFrame(tick); });
        return;
      }
      shell(); startPhase("hold");
    };
    Active.raf = requestAnimationFrame(tick);

    const pauseBtn = el("button",{class:"btn secondary", onclick:()=>{ paused = !paused; pauseBtn.textContent = paused?"Resume":"Pause"; }}, "Pause");
    const skip = el("button",{class:"btn ghost", onclick:()=> this.finishExercise(ex)}, "Skip");
    actions.innerHTML=""; actions.appendChild(pauseBtn); actions.appendChild(skip);
  },

  showInterSetRest(seconds, resume){
    cancelAnimationFrame(Active.raf);
    const back = el("div",{class:"transition-screen"});
    let remaining = seconds, last = performance.now();
    back.innerHTML = `
      <div class="next-up">Rest</div>
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" width="220" height="220">
          <circle class="ring-bg" cx="110" cy="110" r="96"/>
          <circle class="ring-fg" cx="110" cy="110" r="96" stroke-dasharray="603" stroke-dashoffset="0" transform="rotate(-90 110 110)" style="stroke:#E5A6A0"/>
        </svg>
        <div class="ring-label">
          <div class="ring-time tabular" id="rt">${fmtMMSS(remaining)}</div>
          <div class="ring-sub">breathe</div>
        </div>
      </div>
    `;
    const ring = back.querySelector(".ring-fg"); const C=2*Math.PI*96; ring.setAttribute("stroke-dasharray",C);
    const label = back.querySelector("#rt");
    const skipBtn = el("button",{class:"btn ghost", style:"margin-top:30px", onclick:()=>{ cancelAnimationFrame(Active.raf); back.remove(); resume(); }}, "Skip rest");
    back.appendChild(skipBtn);
    overlayRoot.appendChild(back);
    const tick = (now)=>{
      const dt = (now-last)/1000; last=now;
      remaining -= dt;
      if(remaining<=0){ ping(880); buzz(60); back.remove(); resume(); return; }
      const pct = remaining/seconds; ring.setAttribute("stroke-dashoffset", C*(1-pct));
      label.textContent = fmtMMSS(remaining);
      Active.raf = requestAnimationFrame(tick);
    };
    Active.raf = requestAnimationFrame(tick);
  },

  finishExercise(ex){
    cancelAnimationFrame(Active.raf);
    ping(523); buzz(80);
    // log
    const key = `${this.session.id}.${this.session.exerciseIds[this.idx]}`;
    const log = Store.state.exerciseLog[key] || [];
    log.push({ date: new Date().toISOString() });
    Store.state.exerciseLog[key] = log;
    Store.save();

    this.idx++;
    if(this.idx >= this.session.exerciseIds.length){ this.complete(); return; }

    const nextEx = EX[this.session.exerciseIds[this.idx]];
    const transitionSec = ex.transition || 0;
    if(transitionSec > 0){
      this.showTransition(nextEx, transitionSec);
    } else {
      this.renderExercise();
    }
  },

  showTransition(nextEx, seconds){
    const back = el("div",{class:"transition-screen"});
    let remaining = seconds, last = performance.now();
    back.innerHTML = `
      <div class="check-svg" style="margin-bottom:10px">${checkSVG()}</div>
      <div class="next-up">Up next</div>
      <div class="next-name">${escapeHtml(nextEx.name)}</div>
      <svg class="ex-illustration" viewBox="0 0 100 100" style="width:90px;height:90px;margin-bottom:10px"><use href="#${nextEx.svg}"/></svg>
      <div class="ring-wrap" style="width:160px;height:160px">
        <svg viewBox="0 0 220 220" width="160" height="160">
          <circle class="ring-bg" cx="110" cy="110" r="96"/>
          <circle class="ring-fg" cx="110" cy="110" r="96" stroke-dasharray="603" stroke-dashoffset="0" transform="rotate(-90 110 110)" style="stroke:#E5A6A0"/>
        </svg>
        <div class="ring-label">
          <div class="ring-time tabular" id="rt">${fmtMMSS(remaining)}</div>
          <div class="ring-sub">rest</div>
        </div>
      </div>
    `;
    const ring = back.querySelector(".ring-fg"); const C=2*Math.PI*96; ring.setAttribute("stroke-dasharray",C);
    const label = back.querySelector("#rt");
    const skipBtn = el("button",{class:"btn ghost", style:"margin-top:24px", onclick:()=>{ cancelAnimationFrame(Active.raf); back.remove(); this.renderExercise(); }}, "Skip rest");
    back.appendChild(skipBtn);
    overlayRoot.appendChild(back);
    const tick = (now)=>{
      const dt = (now-last)/1000; last=now;
      remaining -= dt;
      if(remaining<=0){ ping(880); buzz(60); back.remove(); this.renderExercise(); return; }
      const pct = remaining/seconds; ring.setAttribute("stroke-dashoffset", C*(1-pct));
      label.textContent = fmtMMSS(remaining);
      Active.raf = requestAnimationFrame(tick);
    };
    Active.raf = requestAnimationFrame(tick);
  },

  complete(){
    cancelAnimationFrame(Active.raf);
    const sessionId = this.session.id;
    const wasComplete = !!Store.state.completedSessions[sessionId];
    Store.state.completedSessions[sessionId] = new Date().toISOString();
    Store.save();

    const totalMin = Math.round((Date.now() - this.sessionStartedAt)/60000);
    overlayRoot.innerHTML = "";
    const back = el("div",{class:"complete-screen"});
    const card = el("div",{class:"complete-card"});
    card.innerHTML = `
      <div class="complete-icon">${checkSVG(80)}</div>
      <h1 style="margin-bottom:6px">Session complete</h1>
      <p class="meta" style="margin-bottom:12px">${escapeHtml(this.session.title)}</p>
      <p style="margin-bottom:18px">${this.session.exerciseIds.length} exercises · ${totalMin} min</p>
    `;
    const doneBtn = el("button",{class:"btn block lg", onclick:()=>{
      back.remove(); overlayRoot.innerHTML=""; this.cleanup();
      Router.go("#/home");
    }}, "Back to home");
    card.appendChild(doneBtn);
    back.appendChild(card);
    overlayRoot.appendChild(back);

    chime();
    confettiBurst(1);

    // week / program celebrations
    setTimeout(()=> this.checkMilestones(sessionId, wasComplete), 600);
  },

  checkMilestones(sessionId, wasComplete){
    const shown = new Set(Store.state.celebrationsShown);
    const session = ALL_SESSIONS.find(s => s.id === sessionId);
    const week = PROGRAM.weeks.find(w => w.id === session.weekId);
    const weekDone = week.sessions.every(s => Store.state.completedSessions[s.id]);
    if(weekDone && !shown.has("week:"+week.id)){
      shown.add("week:"+week.id);
      Store.state.celebrationsShown = [...shown]; Store.save();
      setTimeout(()=>{
        confettiBurst(1.6); chime([523.25,659.25,783.99,1046.5], 0.16);
        toast(`Week ${week.id} complete — ${week.title} ✦`, 3500);
      }, 200);
    }
    const programDone = ALL_SESSIONS.every(s => Store.state.completedSessions[s.id]);
    if(programDone && !shown.has("program:done")){
      shown.add("program:done");
      Store.state.celebrationsShown = [...shown]; Store.save();
      setTimeout(()=>{
        confettiBurst(2.5); chime([523.25,659.25,783.99,1046.5,1318.5], 0.18);
        toast("Program complete — incredible work ✦", 5000);
      }, 800);
    }
  },

  cleanup(){
    cancelAnimationFrame(Active.raf);
    overlayRoot.innerHTML = "";
  }
};

/* ============================================================
   SETTINGS VIEW
   ============================================================ */
function viewSettings(){
  const p = Store.state.preferences;
  const top = el("div",{class:"topbar"},
    el("button",{class:"icon-btn", "aria-label":"Back", onclick:()=>Router.go("#/home")}, iconBack()),
    el("div",{class:"brand-name"}, "Settings"),
    el("div",{style:"width:48px"})
  );
  function toggle(label, key, helper){
    const row = el("div",{class:"settings-row"},
      el("div",{},
        el("div",{}, label),
        helper ? el("div",{class:"meta", style:"font-size:.82rem"}, helper) : null
      ),
      el("div",{class:"toggle"+(p[key]?" on":""), role:"switch", "aria-checked":p[key]?"true":"false", tabindex:"0", onclick:(e)=>{
        p[key] = !p[key]; Store.save(); render(); if(p[key] && key==="soundOn") ensureAudio();
      }})
    );
    return row;
  }
  const card = el("div",{class:"card"},
    el("h2",{style:"margin-bottom:12px"}, "Preferences"),
    toggle("Sound", "soundOn", "Soft chimes for completed timers and sets"),
    toggle("Haptic feedback", "vibrate", "Subtle vibration on supported devices"),
    toggle("Reduce motion", "reduceMotion", "Skip confetti and large animations")
  );

  const completed = Store.state.completedSessions;
  const data = el("div",{class:"card"},
    el("h2",{style:"margin-bottom:12px"}, "Your data"),
    el("p",{class:"meta", style:"margin-bottom:14px"}, `${Object.keys(completed).length} of ${TOTAL_SESSIONS} sessions complete. Stored on this device only.`),
    el("button",{class:"btn secondary", style:"margin-right:8px", onclick:()=>{
      const blob = JSON.stringify(Store.state, null, 2);
      navigator.clipboard?.writeText(blob).then(
        ()=>toast("Progress copied to clipboard"),
        ()=>toast("Couldn't copy"));
    }}, "Export progress"),
    el("button",{class:"btn ghost", onclick:()=>{
      if(confirm("Reset all progress? This cannot be undone.")){
        Store.reset(); Store.load(); render(); toast("Progress reset");
      }
    }}, "Reset progress")
  );

  const about = el("div",{class:"card"},
    el("h3",{style:"margin-bottom:8px"}, "About this program"),
    el("p",{class:"meta"}, "A 4-week post-clearance C-section recovery framework starting at post-op week 7. Move at your own pace. Skip anything that feels off. This complements — not replaces — your provider's guidance."),
    el("button",{class:"link", style:"margin-top:10px", onclick:()=>showDisclaimer(true)}, "Show clearance check again")
  );

  return [top, card, data, about];
}

/* ============================================================
   ICONS
   ============================================================ */
function iconCog(){ const span = el("span"); span.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`; return span; }
function iconBack(){ const s=el("span"); s.innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`; return s; }
function iconClose(){ const s=el("span"); s.innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`; return s; }
function iconHeartHTML(){ return `<svg width="20" height="20" viewBox="0 0 24 24" fill="#9C5A2A" stroke="none"><path d="M12 21s-7-4.5-9.5-9C.5 7 4 3 8 4c1.5.4 3 1.6 4 3 1-1.4 2.5-2.6 4-3 4-1 7.5 3 5.5 8C19 16.5 12 21 12 21z"/></svg>`; }
function iconCheckHTML(){ return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F6E5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`; }
function checkSVG(size=64){
  return `<svg class="check-svg" width="${size}" height="${size}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#E6EFE8"/><path fill="none" stroke="#4F6E5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M18 33 L28 43 L46 23"/></svg>`;
}
function medalSVG(){
  return `<svg class="medal" viewBox="0 0 80 80"><path d="M28 6 L40 36 L52 6 Z" fill="#E5A6A0"/><circle cx="40" cy="50" r="20" fill="#7A9B85"/><circle cx="40" cy="50" r="14" fill="#E6EFE8"/><path d="M32 50 L38 56 L50 44" fill="none" stroke="#4F6E5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  if(disclaimerNeeded()){ showDisclaimer(); return; }
  const r = Router.parse();
  let nodes = [];
  if(r.name === "session" && r.arg) nodes = viewSession(r.arg);
  else if(r.name === "active" && r.arg){
    overlayRoot.innerHTML = "";
    Active.start(r.arg);
    return;
  }
  else if(r.name === "settings") nodes = viewSettings();
  else nodes = viewHome();
  root.innerHTML = "";
  nodes.forEach(n => n && root.appendChild(n));
  window.scrollTo(0,0);
}
Router.bind(render);
Store.load();
render();

})();
</script>
